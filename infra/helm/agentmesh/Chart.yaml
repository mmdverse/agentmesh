apiVersion: v2
name: agentmesh
description: AgentMesh - Production-grade Infrastructure Gateway and Control Plane for AI Agents
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - ai
  - agents
  - a2a
  - gateway
  - service-mesh
  - mcp
  - infrastructure
  - control-plane
  - data-plane
home: https://github.com/mmdverse/agentmesh
sources:
  - https://github.com/mmdverse/agentmesh
maintainers:
  - name: Mohammad
    url: https://t.me/llllxyz
dependencies:
  - name: postgresql
    version: 12.12.10
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 18.6.5
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: nats
    version: 0.19.1
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
