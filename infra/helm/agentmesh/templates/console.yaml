apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentmesh.fullname" . }}-console
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.replicaCount.console }}
  selector:
    matchLabels:
      {{- include "agentmesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "agentmesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      containers:
        - name: console
          image: "{{ .Values.image.console.repository }}:{{ .Values.image.console.tag }}"
          imagePullPolicy: {{ .Values.image.console.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: CONTROL_PLANE_URL
              value: {{ .Values.config.controlPlaneUrl | quote }}
            - name: GATEWAY_URL
              value: {{ .Values.config.gatewayUrl | quote }}
            - name: NEXT_PUBLIC_CONTROL_PLANE_URL
              value: {{ .Values.config.controlPlaneUrl | quote }}
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: {{ .Values.config.gatewayUrl | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.console | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentmesh.fullname" . }}-console
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.service.console.type }}
  ports:
    - port: {{ .Values.service.console.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agentmesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
