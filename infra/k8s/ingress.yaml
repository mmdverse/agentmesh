apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentmesh-ingress
  namespace: agentmesh
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    - host: agentmesh.local
      http:
        paths:
          - path: /()(.*)
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  number: 3000
          - path: /api/gateway(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3001
          - path: /api/control-plane(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 3002
          - path: /v1(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3001
---
# For direct gateway access (data plane)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: agentmesh
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.agentmesh.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3001
---
# For control-plane direct
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-plane-ingress
  namespace: agentmesh
spec:
  ingressClassName: nginx
  rules:
    - host: control-plane.agentmesh.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 3002
