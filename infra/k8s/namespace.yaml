apiVersion: v1
kind: Namespace
metadata:
  name: agentmesh
  labels:
    name: agentmesh
    app: agentmesh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmesh-config
  namespace: agentmesh
data:
  NODE_ENV: "production"
  NATS_URL: "nats://nats:4222"
  REDIS_URL: "redis://redis:6379"
  DATABASE_URL: "postgresql://agentmesh:agentmesh_secret@postgres:5432/agentmesh"
  S3_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "agentmesh-artifacts"
  GATEWAY_PORT: "3001"
  CONTROL_PLANE_PORT: "3002"
  VERSION: "0.1.0-phase5"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentmesh-secrets
  namespace: agentmesh
type: Opaque
stringData:
  JWT_SECRET: "change_this_in_production_use_strong_secret"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin123"
  POSTGRES_PASSWORD: "agentmesh_secret"
