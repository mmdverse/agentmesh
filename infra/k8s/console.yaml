apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: agentmesh
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      containers:
        - name: console
          image: agentmesh/console:0.1.0-phase5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: CONTROL_PLANE_URL
              value: http://control-plane:3002
            - name: GATEWAY_URL
              value: http://gateway:3001
            - name: NEXT_PUBLIC_CONTROL_PLANE_URL
              value: http://control-plane:3002
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: http://gateway:3001
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: agentmesh
spec:
  selector:
    app: console
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
