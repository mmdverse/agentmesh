name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: agentmesh_secret
          POSTGRES_DB: agentmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format:check

      - name: Build (must before typecheck for composite projects)
        run: pnpm turbo run build --concurrency=1

      - name: Lint
        run: pnpm turbo run lint --concurrency=1

      - name: Typecheck
        run: pnpm turbo run typecheck --concurrency=1

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://agentmesh:agentmesh_secret@localhost:5432/agentmesh
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Gateway Image
        run: docker build -f apps/gateway/Dockerfile -t agentmesh/gateway:ci . --progress=plain 2>&1 | tail -n 100
      - name: Build Control Plane Image
        run: docker build -f apps/control-plane/Dockerfile -t agentmesh/control-plane:ci . --progress=plain 2>&1 | tail -n 100
      - name: Build Console Image
        run: docker build -f apps/console/Dockerfile -t agentmesh/console:ci . --progress=plain 2>&1 | tail -n 100

  console-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Console Build
        run: pnpm turbo run build --filter=@agentmesh/console --concurrency=1
